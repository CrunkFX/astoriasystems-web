<!-- ============================================================
     Astoria Systems – Eigene Login-Seite (Frappe Web Page)
     ------------------------------------------------------------
     Komplett selbstständige, gebrandete Anmeldeseite.
     Einfügen in: Webseite (Web Page) -> Inhaltstyp "HTML" ->
     Feld "Hauptteil (HTML)". Pfad z. B. "anmelden"
     (NICHT "login" – das ist von Frappe belegt).

     Meldet via Frappe-Login-API an (POST /api/method/login),
     leitet danach auf ?redirect-to oder die Home-Page weiter.
     Standard-Passwort-Login + "Passwort vergessen".
     ============================================================ -->
<div id="al-root">
  <canvas id="al-canvas" aria-hidden="true"></canvas>

  <div class="al-card">
    <img class="al-logo" src="https://www.astoria.systems/logo-light.svg" alt="Astoria Systems" />
    <h1 class="al-title">Willkommen zurück</h1>
    <p class="al-sub">Bei Astoria Systems anmelden</p>

    <form id="al-form" novalidate>
      <label class="al-label" for="al-email">E-Mail</label>
      <input class="al-input" id="al-email" type="email" autocomplete="username"
             placeholder="name@firma.de" required />

      <label class="al-label" for="al-pw">Passwort</label>
      <div class="al-pw-wrap">
        <input class="al-input" id="al-pw" type="password" autocomplete="current-password"
               placeholder="••••••••" required />
        <button type="button" class="al-pw-toggle" id="al-pw-toggle" aria-label="Passwort anzeigen">Anzeigen</button>
      </div>

      <div class="al-row">
        <a href="#" id="al-forgot" class="al-link">Passwort vergessen?</a>
      </div>

      <button type="submit" class="al-btn" id="al-submit">Anmelden</button>

      <div class="al-msg" id="al-msg" role="alert"></div>
    </form>
  </div>
</div>

<style>
  /* Frappe-Standardlayout auf dieser Seite ausblenden */
  body { background: #f8fafc; }
  .navbar, header.navbar, .web-footer, footer.web-footer, .footer,
  .page-head, .breadcrumb-container { display: none !important; }
  .page_content, .main-section, main { padding: 0 !important; margin: 0 !important; }

  #al-root {
    position: fixed; inset: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #4f4f4f; padding: 1.5rem;
  }
  #al-canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }

  .al-card {
    position: relative; z-index: 2;
    width: 100%; max-width: 400px;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(24px) saturate(1.2);
    -webkit-backdrop-filter: blur(24px) saturate(1.2);
    border: 1px solid rgba(226, 232, 240, 0.6);
    border-radius: 1rem;
    box-shadow: 0 16px 48px rgba(0,0,0,0.10), inset 0 1px 0 rgba(255,255,255,0.5);
    padding: 2.25rem 2rem;
    text-align: center;
  }
  .al-logo { height: 40px; width: auto; margin: 0 auto 1.25rem; display: block; }
  .al-title { font-size: 1.4rem; font-weight: 700; color: #030712; margin: 0 0 .25rem; }
  .al-sub { font-size: .9rem; color: #6b7280; margin: 0 0 1.5rem; }

  .al-label {
    display: block; text-align: left; font-size: .8rem; font-weight: 600;
    color: #030712; margin: 0 0 .35rem;
  }
  .al-input {
    width: 100%; box-sizing: border-box;
    padding: .7rem .85rem; margin-bottom: 1rem;
    border: 1px solid #e2e8f0; border-radius: .55rem;
    background: #fff; font-size: .95rem; color: #1f2937;
    transition: border-color .15s, box-shadow .15s;
  }
  .al-input:focus {
    outline: none; border-color: #00e5ff;
    box-shadow: 0 0 0 3px rgba(0,229,255,0.22);
  }
  .al-pw-wrap { position: relative; }
  .al-pw-toggle {
    position: absolute; right: .6rem; top: .55rem;
    background: none; border: none; cursor: pointer;
    font-size: .8rem; color: #2e9aa0; font-weight: 600; padding: .15rem .3rem;
  }
  .al-row { text-align: right; margin: -.4rem 0 1.1rem; }
  .al-link { font-size: .82rem; color: #2e9aa0; text-decoration: none; }
  .al-link:hover { text-decoration: underline; }

  .al-btn {
    width: 100%; padding: .75rem 1rem; border: none; cursor: pointer;
    border-radius: .55rem; font-size: .95rem; font-weight: 600; color: #052b30;
    background: linear-gradient(135deg, #00e5ff, #3fe0d0);
    transition: transform .15s, box-shadow .15s;
  }
  .al-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,229,255,0.4); }
  .al-btn:disabled { opacity: .65; cursor: default; transform: none; box-shadow: none; }

  .al-msg { margin-top: 1rem; font-size: .85rem; min-height: 1.1em; }
  .al-msg.error { color: #dc2626; }
  .al-msg.ok { color: #2e9aa0; }
</style>

<script>
(function () {
  // ---------- Login-Logik ----------
  var form = document.getElementById('al-form');
  var email = document.getElementById('al-email');
  var pw = document.getElementById('al-pw');
  var submit = document.getElementById('al-submit');
  var msg = document.getElementById('al-msg');
  var toggle = document.getElementById('al-pw-toggle');
  var forgot = document.getElementById('al-forgot');

  function params() { return new URLSearchParams(window.location.search); }
  function safeRedirect(target) {
    if (target && target.charAt(0) === '/') return target;
    return '/app';
  }
  function csrf() {
    return (window.frappe && frappe.csrf_token) || window.csrf_token || '';
  }

  toggle.addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.textContent = show ? 'Verbergen' : 'Anzeigen';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.className = 'al-msg'; msg.textContent = '';
    if (!email.value || !pw.value) { msg.className = 'al-msg error'; msg.textContent = 'Bitte E-Mail und Passwort eingeben.'; return; }
    submit.disabled = true; submit.textContent = 'Anmelden …';

    fetch('/api/method/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-Frappe-CSRF-Token': csrf() },
      credentials: 'include',
      body: new URLSearchParams({ usr: email.value.trim(), pwd: pw.value })
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
    }).then(function (r) {
      if (r.ok) {
        var redirectTo = params().get('redirect-to');
        window.location.href = safeRedirect(redirectTo || (r.data && r.data.home_page) || '/app');
      } else {
        submit.disabled = false; submit.textContent = 'Anmelden';
        msg.className = 'al-msg error';
        msg.textContent = (r.data && (r.data.message || r.data._server_messages)) ? 'Anmeldung fehlgeschlagen. Bitte Zugangsdaten prüfen.' : 'Anmeldung fehlgeschlagen.';
      }
    }).catch(function () {
      submit.disabled = false; submit.textContent = 'Anmelden';
      msg.className = 'al-msg error'; msg.textContent = 'Verbindungsfehler. Bitte erneut versuchen.';
    });
  });

  forgot.addEventListener('click', function (e) {
    e.preventDefault();
    if (!email.value) { msg.className = 'al-msg error'; msg.textContent = 'Bitte zuerst deine E-Mail eingeben.'; email.focus(); return; }
    fetch('/api/method/frappe.core.doctype.user.user.reset_password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-Frappe-CSRF-Token': csrf() },
      credentials: 'include',
      body: new URLSearchParams({ user: email.value.trim() })
    }).finally(function () {
      msg.className = 'al-msg ok';
      msg.textContent = 'Falls die E-Mail existiert, wurde ein Link zum Zurücksetzen gesendet.';
    });
  });

  // ---------- Trianglify-Hintergrund (wie auf der Website) ----------
  var canvas = document.getElementById('al-canvas');
  var ctx = canvas.getContext('2d');
  if (!ctx) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var COLORS = [
    [250,254,255],[244,252,254],[236,250,253],[226,246,250],[212,241,246],
    [196,235,241],[176,229,236],[150,220,230],[120,210,222],[90,200,215],
    [63,224,208],[0,229,255]
  ];
  function inCirc(p,a,b,c){var ax=a[0]-p[0],ay=a[1]-p[1],bx=b[0]-p[0],by=b[1]-p[1],cx=c[0]-p[0],cy=c[1]-p[1];return (ax*ax+ay*ay)*(bx*cy-cx*by)-(bx*bx+by*by)*(ax*cy-cx*ay)+(cx*cx+cy*cy)*(ax*by-bx*ay)>0;}
  function triangulate(pts){var n=pts.length;if(n<3)return[];var mnX=1/0,mnY=1/0,mxX=-1/0,mxY=-1/0;for(var i=0;i<n;i++){if(pts[i][0]<mnX)mnX=pts[i][0];if(pts[i][1]<mnY)mnY=pts[i][1];if(pts[i][0]>mxX)mxX=pts[i][0];if(pts[i][1]>mxY)mxY=pts[i][1];}var d=Math.max(mxX-mnX,mxY-mnY),mx=(mnX+mxX)/2,my=(mnY+mxY)/2;pts.push([mx-20*d,my-d]);pts.push([mx+20*d,my-d]);pts.push([mx,my+20*d]);var tr=[[n,n+1,n+2]];for(var i=0;i<n;i++){var ed=[],rm=[];for(var j=0;j<tr.length;j++){var t=tr[j];if(inCirc(pts[i],pts[t[0]],pts[t[1]],pts[t[2]])){rm.push(j);ed.push([t[0],t[1]]);ed.push([t[1],t[2]]);ed.push([t[2],t[0]]);}}for(var j=rm.length-1;j>=0;j--)tr.splice(rm[j],1);var ue=[];for(var j=0;j<ed.length;j++){var dup=false;for(var k=0;k<ed.length;k++){if(j!==k&&ed[j][0]===ed[k][1]&&ed[j][1]===ed[k][0]){dup=true;break;}}if(!dup)ue.push(ed[j]);}for(var j=0;j<ue.length;j++)tr.push([ue[j][0],ue[j][1],i]);}var res=[];for(var i=0;i<tr.length;i++)if(tr[i][0]<n&&tr[i][1]<n&&tr[i][2]<n)res.push(tr[i]);pts.splice(n,3);return res;}
  function lerp(a,b,t){return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)];}
  function pick(t){t=Math.max(0,Math.min(1,t));var idx=t*(COLORS.length-1),lo=Math.floor(idx);return lerp(COLORS[lo],COLORS[Math.min(lo+1,COLORS.length-1)],idx-lo);}
  var base=[],tris=[],cols=[],seeds=[],w=0,h=0,regen=true,time=0,drift=7,speed=0.0004;
  function setup(){w=window.innerWidth;h=window.innerHeight;if(!w||!h)return;canvas.width=w*dpr;canvas.height=h*dpr;var cs=70,jit=cs*0.75;base=[];seeds=[];var cc=Math.ceil(w/cs)+2,rr=Math.ceil(h/cs)+2;for(var r=-1;r<=rr;r++)for(var c=-1;c<=cc;c++){base.push([c*cs+(Math.random()-0.5)*jit,r*cs+(Math.random()-0.5)*jit]);seeds.push([Math.random()*6.28,Math.random()*6.28,0.7+Math.random()*0.6]);}var p=[];for(var i=0;i<base.length;i++)p.push([base[i][0],base[i][1]]);tris=triangulate(p);cols=[];for(var i=0;i<tris.length;i++){var t=tris[i],x=(base[t[0]][0]+base[t[1]][0]+base[t[2]][0])/3,y=(base[t[0]][1]+base[t[1]][1]+base[t[2]][1])/3;cols.push(pick(x/w*0.6+y/h*0.4+(Math.random()-0.5)*0.15));}regen=false;}
  function paint(anim){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);for(var i=0;i<tris.length;i++){var t=tris[i],x0=base[t[0]][0],y0=base[t[0]][1],x1=base[t[1]][0],y1=base[t[1]][1],x2=base[t[2]][0],y2=base[t[2]][1];if(anim){var s0=seeds[t[0]],s1=seeds[t[1]],s2=seeds[t[2]];x0+=Math.sin(time*s0[2]+s0[0])*drift;y0+=Math.cos(time*s0[2]+s0[1])*drift;x1+=Math.sin(time*s1[2]+s1[0])*drift;y1+=Math.cos(time*s1[2]+s1[1])*drift;x2+=Math.sin(time*s2[2]+s2[0])*drift;y2+=Math.cos(time*s2[2]+s2[1])*drift;}var c=cols[i];ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.lineTo(x2,y2);ctx.closePath();ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=0.8;ctx.stroke();}}
  function loop(){if(regen)setup();if(base.length){time+=speed;paint(true);}requestAnimationFrame(loop);}
  setup();reduced?paint(false):requestAnimationFrame(loop);
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){regen=true;},200);});
})();
</script>
