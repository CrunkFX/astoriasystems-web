# astoriasystems-web nginx – Ergänzungen zum Ploi-Webserver-Template „Astro static“ (website-deploy-template).
#
# Wird von ploi/deploy.sh nach /etc/nginx/ploi/<domain>/server/astro.conf kopiert (Benutzer mit sudo)
# oder von `bash ploi/ploi.sh nginx-push` per Ploi-API hinter `include /etc/nginx/ploi/<domain>/server/*;`
# eingefügt (isolierte Benutzer). Die erste Zeile ist der Marker, an dem beide erkennen, ob das schon
# geschehen ist – nicht ändern. ploi/nginx/webserver-template.conf ist die vollständige Fassung.
#
# Voraussetzung: Die Site wurde mit dem Template „Astro static“ angelegt (Web directory /dist,
# 404-Seite, Cache-Header, gzip, X-Content-Type-Options, Referrer-Policy, Permissions-Policy).
# Hier steht nur, was astoria.systems darüber hinaus braucht: die Entsprechung von public/_headers
# und public/_redirects aus der Cloudflare-Pages-Zeit und das Kontaktformular (/api/contact).
#
# Kein Host-Redirect: Ploi leitet astoria.systems beim Zertifikat-Einbau selbst auf www.astoria.systems
# um (/etc/nginx/ploi/<domain>/before/ssl-redirect.conf), weil die Site www.* heißt. Eine eigene
# Umleitung in die Gegenrichtung ergäbe eine Schleife.

# HSTS (public/_headers hatte es nicht, Cloudflare setzte es selbst). `always`: auch auf 301/404.
# X-Frame-Options setzt das Template mit SAMEORIGIN; DENY wie in _headers steht in
# ploi/nginx/webserver-template.conf (ein zweiter add_header hier ergäbe zwei Kopfzeilen).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Alte Odoo-Adressen (public/_redirects). Anker (#…) erreichen den Server nicht, deshalb führt jede
# alte Adresse auf die neue Seite ohne Anker; /hilfe → /hilfe aus _redirects entfällt (Selbstumleitung).
location = /our-services { return 301 /produkte; }
location = /about-us     { return 301 /ueber-uns; }
location = /contactus    { return 301 /kontakt; }
location = /pricing      { return 301 /preise; }
location = /privacy      { return 301 /datenschutz; }

# Kontaktformular: POST /api/contact → server/kontakt.php (außerhalb von dist/, wird nie ausgeliefert) über
# den PHP-FPM-Pool der Site; das Skript verschickt über Lettermint (Token in der .env der Site). Voraussetzung
# in Ploi: PHP 8.5 auf dem Server installiert und der Site zugewiesen (Pool php8.5-fpm-<Systembenutzer>; gilt für
# Sites mit eigenem Systembenutzer – unter dem Standardbenutzer ploi hieße er php8.5-fpm.sock).
# $realpath_root löst den Release-Symlink des Zero-Downtime-Deployments auf – jede Version führt ihr eigenes
# Skript aus. {SYSTEM_USER} und {DOMAIN} füllen ploi/deploy.sh bzw. `ploi/ploi.sh nginx-push` beim Einsetzen.
location = /api/contact {
    root /home/{SYSTEM_USER}/{DOMAIN}/server;
    client_max_body_size 64k;
    fastcgi_param SCRIPT_FILENAME $realpath_root/kontakt.php;
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.5-fpm-{SYSTEM_USER}.sock;
}

# Adressen ohne Slash am Ende (astro.config.mjs: trailingSlash 'never' – Canonical, hreflang und Sitemap
# nennen /produkte, nicht /produkte/). Die Seiten liegen als produkte/index.html; Plois `try_files $uri $uri/`
# würde /produkte mit 301 auf /produkte/ umleiten, also die kanonische Adresse selbst. Deshalb: /pfad/ → /pfad
# umleiten und /pfad direkt aus pfad/index.html bedienen (Reihenfolge wichtig: die Umleitung zuerst).
# HTML nicht zwischenspeichern (expires statt add_header, damit die Kopfzeilen des server{}-Blocks bleiben).
location ~ ^(.+)/$ {
    return 301 $1$is_args$args;
}
location ~ ^/[^.]+$ {
    try_files $uri $uri/index.html =404;
    expires -1;
}
