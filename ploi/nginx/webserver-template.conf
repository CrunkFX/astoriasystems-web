# astoriasystems-web nginx – vollständige Ploi-Webserver-Konfiguration der Site www.astoria.systems.
#
# = Ploi-Webserver-Template „Astro static“ (AstoriaSystems/website-deploy-template) plus die
# Ergänzungen aus ploi/nginx/astro.conf. Einsetzen im Panel unter Site → Manage → NGINX configuration
# (Platzhalter {DOMAIN}, {SYSTEM_USER}, {DIRECTORY} durch www.astoria.systems, den Site-Benutzer und
# /dist ersetzen) oder als eigenes Webserver-Template im Ploi-Profil speichern. Die erste Zeile ist der
# Marker, den ploi/deploy.sh prüft – nicht ändern. Beim Zertifikat-Einbau kommentiert Ploi `listen 80`
# aus, füllt /etc/nginx/ssl/{DOMAIN} und legt before/ssl-redirect.conf an (http → https, Apex → www).

# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/{DOMAIN}/before/*;

server {
    listen 80;
    listen [::]:80;

    root /home/{SYSTEM_USER}/{DOMAIN}{DIRECTORY};
    server_name {DOMAIN}; # Alias astoria.systems trägt Ploi ein (Site → Aliases)

    include /etc/nginx/ssl/{DOMAIN};

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparams.pem;

    index index.html index.htm;

    # Kopfzeilen wie früher in public/_headers (Cloudflare Pages) plus HSTS. `always`: auch auf 301/404.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    charset utf-8;

    # Ploi Configuration, do not remove!
    include /etc/nginx/ploi/{DOMAIN}/server/*;

    # Kein Host-Redirect: Ploi leitet astoria.systems selbst auf www.astoria.systems um
    # (before/ssl-redirect.conf, entsteht mit dem Zertifikat), weil die Site www.* heißt.

    # Alte Odoo-Adressen (früher public/_redirects). Anker (#…) erreichen den Server nicht.
    location = /our-services { return 301 /produkte; }
    location = /about-us     { return 301 /ueber-uns; }
    location = /contactus    { return 301 /kontakt; }
    location = /pricing      { return 301 /preise; }
    location = /privacy      { return 301 /datenschutz; }

    # Astro erzeugt dist/404.html – als 404-Seite verwenden.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Adressen ohne Slash am Ende (astro.config.mjs: trailingSlash 'never' – Canonical, hreflang und
    # Sitemap nennen /produkte, nicht /produkte/). Die Seiten liegen als produkte/index.html; `location /`
    # unten würde /produkte mit 301 auf /produkte/ umleiten, also die kanonische Adresse selbst. Deshalb:
    # /pfad/ → /pfad umleiten und /pfad direkt aus pfad/index.html bedienen (Umleitung zuerst). HTML nicht
    # zwischenspeichern (expires statt add_header, damit die Kopfzeilen des server{}-Blocks bleiben).
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }
    location ~ ^/[^.]+$ {
        try_files $uri $uri/index.html =404;
        expires -1;
    }

    # Gehashte Build-Assets (/_astro/*.js, *.css, Bilder): ein Jahr cachen.
    location ^~ /_astro/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Statische Dateien aus public/: 30 Tage cachen.
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|mp4|webm|pdf|webmanifest)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # HTML immer neu validieren, damit Deployments sofort sichtbar sind.
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # Kennung des Standes, robots.txt und Sitemaps: kurz zwischenspeichern.
    location ~* ^/(bereitstellung\.txt|robots\.txt|sitemap.*\.xml)$ {
        expires 5m;
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Kompression für Text-Ressourcen.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
        application/manifest+json application/xml application/rss+xml image/svg+xml font/ttf font/otf;

    # Startseite (/ → index.html); alle anderen Seiten bedient die Regel ohne Slash weiter oben.
    location / {
        try_files $uri $uri/ =404;
    }

    access_log off;
    error_log  /var/log/nginx/{DOMAIN}-error.log error;

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/{DOMAIN}/after/*;
